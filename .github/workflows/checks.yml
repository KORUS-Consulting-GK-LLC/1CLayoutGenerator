name: Backend and portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.9'}
          - {os: windows-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    env:
      FORM_MOCKUP_UI_TESTS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python skills/1c-form-mockup/scripts/verify_package.py skills/1c-form-mockup
      - run: python -m unittest discover -s skills/1c-form-mockup/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python layout.py demo
      - run: python tools/build_package.py
